name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (dev extra covers pytest + mcp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q

  adapters:
    # The six framework adapters are optional extras, so their test files
    # self-skip when the framework is absent — without this job a clean run
    # was 43 passed / 75 skipped and every adapter regression merged green.
    # One Python version only: installing six agent frameworks is ~1.2GB of
    # transitive deps, and the adapters contain no version-specific code paths.
    name: Framework adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with every adapter extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langchain,crewai,llamaindex,adk,msagent,strands]"
      - name: Install the model providers the examples name
        # tests/test_examples.py executes every script in examples/ against the
        # real framework. Each constructs a model at import time, so without
        # these the whole file skips and a broken example merges green.
        run: |
          python -m pip install langchain-openai llama-index-llms-openai agent-framework-openai
      - name: Run tests
        run: python -m pytest tests/ -q

  typescript:
    # typescript/ publishes to npm as @anona-labs/memory and, until now, was
    # tested by nothing here — the same failure the adapters job above exists to
    # prevent, in a language this workflow never mentioned. It is why scoping,
    # asOf, getContext and source_ids could be absent from the published package
    # for several releases with CI green the whole time: no job, so no failure.
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --prefer-offline
      # Each step runs even after an earlier one fails, so a typecheck error
      # does not hide a test failure behind it.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck
      - name: Test
        if: '!cancelled()'
        run: npm run test
      - name: Build
        if: '!cancelled()'
        run: npm run build
