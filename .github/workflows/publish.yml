name: Publish to PyPI

# Publishes when a GitHub Release is published (tag it vX.Y.Z first, then
# create the Release), or run manually against TestPyPI via the workflow
# dispatch. Version comes from pyproject.toml — bump it before releasing.
#
# Skipped for `npm-v*` tags, which belong to publish-npm.yml. Both workflows
# listen to every release in this repo, so without the guard a TypeScript
# release would also upload the Python package at whatever version happened to
# be in pyproject.toml.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Two auth paths, and the action picks between them by whether `password`
    # is empty: an empty value means Trusted Publishing (OIDC, nothing stored),
    # a value means that API token.
    #
    # OIDC is the target state, but it needs a pending publisher configured on
    # PyPI by an account that owns the project — so the token exists to get the
    # first version out. Delete the secret once OIDC is configured; an
    # account-wide upload token can publish *any* project you own.
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
