[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anona"
version = "0.5.2"
description = "Anona Memory SDK — managed AI memory for intelligent agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anona Labs" }]
keywords = ["ai", "memory", "agents", "llm", "rag", "mcp"]
dependencies = ["httpx>=0.24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/anonalabs/Anona-Memory-SDK"
Repository = "https://github.com/anonalabs/Anona-Memory-SDK"

[project.optional-dependencies]
litellm = ["litellm>=1.0"]
# Upper bound is load-bearing: mcp 2.x moved FastMCP out of
# mcp.server.fastmcp, so an unpinned install resolves 2.x and anona-mcp fails
# at import with ModuleNotFoundError before it can serve anything.
mcp = ["mcp>=1.2,<2"]
# Pulls mcp through the extra above rather than repeating the requirement, so
# the two can never drift — an unpinned copy here is what turned the mcp 2.x
# release into a red main while the extra itself looked correct.
dev = ["pytest", "pytest-asyncio", "respx", "anyio", "anona[mcp]"]

[project.scripts]
anona-mcp = "anona.integrations.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anona*"]
