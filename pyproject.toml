[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anona"
version = "0.6.0"
description = "Anona Memory SDK — managed AI memory for intelligent agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anona Labs" }]
keywords = ["ai", "memory", "agents", "llm", "rag", "mcp"]
dependencies = ["httpx>=0.24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/anonalabs/Anona-Memory-SDK"
Repository = "https://github.com/anonalabs/Anona-Memory-SDK"

[project.optional-dependencies]
litellm = ["litellm>=1.0"]
# Upper bound is load-bearing: mcp 2.x moved FastMCP out of
# mcp.server.fastmcp, so an unpinned install resolves 2.x and anona-mcp fails
# at import with ModuleNotFoundError before it can serve anything.
mcp = ["mcp>=1.2,<2"]
# Pulls mcp through the extra above rather than repeating the requirement, so
# the two can never drift — an unpinned copy here is what turned the mcp 2.x
# release into a red main while the extra itself looked correct.
# Floor raised from >=1.0/>=0.3 (verified against real wheels): AnonaMemory's
# awrap_model_call reads ModelRequest.system_message and calls
# request.override(system_message=...) -- that field does not exist until
# langchain==1.1.0. 1.0.0 through 1.0.8 only have system_prompt: str (confirmed
# directly against those wheels), so request.system_message there is a bare
# AttributeError, not our guarded ImportError -- it never touches require().
# 1.1.0 and every 1.2.x release fix the field but pin langgraph<1.1.0,>=1.0.2 in
# their OWN metadata, a range that predates langgraph.runtime.ExecutionInfo;
# merely importing langchain.agents.middleware (require()'s target) executes
# langchain/agents/__init__.py, which imports create_agent, which imports that
# symbol, so a fresh install of langchain==1.1.0 or any 1.2.x crashes at import
# time inside langgraph's own module chain (still require()-caught, so still
# friendly, just naming the wrong package). Only at langchain==1.3.0 does
# langchain's own metadata bump its langgraph pin to >=1.2.0,<1.3.0, which
# resolves clean. Verified end to end: the full adapter suite (11 tests) passes
# against a fresh isolated venv with the literal langchain==1.3.0 floor pinned
# and everything else -- langchain-core 1.5.3, langgraph 1.2.10 -- resolved
# fresh by pip. langchain-core's own floor is raised to match: langchain==1.3.0
# itself requires langchain-core<2.0.0,>=1.4.0, so the previous >=0.3 was never
# reachable through a real install anyway.
langchain = ["langchain>=1.3", "langchain-core>=1.4"]
# Floor is >=1.0, not the plan's original >=0.100: verified against 1.15.13
# (current as of writing) that CrewAI's pre-1.0 ExternalMemory/Storage is
# gone, replaced by a unified Memory class whose pluggable StorageBackend is
# a raw vector store — see anona/integrations/crewai.py's module docstring.
# This adapter targets crewai.tools (@tool/BaseTool), which is what's
# actually verified to work; >=0.100 would advertise support for the old,
# pre-rewrite memory shape this adapter does not use.
crewai = ["crewai>=1.0"]
# Floor is >=0.14, not the original >=0.12: Memory/BaseMemoryBlock (what this
# adapter targets) don't exist until 0.12.35 - every 0.12.0..0.12.34.post1
# release satisfies a >=0.12 floor and ships only the older
# ChatMemoryBuffer/VectorMemory. >=0.14 is what was actually installed and
# exercised (0.14.23); nobody has verified the true 0.12.35 minimum, so it
# isn't declared here. See AnonaMemoryBlock's ImportError guard for what a
# too-old install gets instead of a bare AttributeError.
llamaindex = ["llama-index-core>=0.14"]
# Floor raised from >=1.0 (verified against real wheels): everything this
# adapter's own require() calls import -- base_memory_service.
# {BaseMemoryService, SearchMemoryResponse}, memory_entry.MemoryEntry,
# google.genai.types.{Content, Part} -- already exists with a matching shape at
# the literal 1.0.0 floor (confirmed against that wheel directly). The real gap
# is in the module docstring's own documented usage pattern instead: wiring an
# after_agent_callback that awaits callback_context.add_session_to_memory().
# CallbackContext has no such method before google-adk==1.21.0 (bisected via
# hasattr across installed versions: False through 1.20.0, True from 1.21.0 on
# -- 2.6.2 and 2.6.3 expose it by aliasing CallbackContext = Context rather than
# defining it inline, which is why a plain text search of callback_context.py
# is unreliable and hasattr is what actually settled it). Below the real floor,
# a customer following the documented pattern gets AttributeError:
# 'CallbackContext' object has no attribute 'add_session_to_memory' the first
# time their own after_agent_callback runs -- outside any require()-guarded
# path, since nothing in anona/integrations/google_adk.py itself touches
# CallbackContext; there is no local hasattr guard to add here, only the floor.
# Verified end to end: the full adapter suite (14 tests) passes against a
# completely fresh isolated venv with the literal google-adk==1.21.0 floor
# pinned, no other workaround.
adk = ["google-adk>=1.21"]
# Package is agent-framework-core, not the brief's agent-framework: verified
# via the installed distribution's own METADATA that bare "agent-framework"
# depends on nothing but "agent-framework-core[all]==<same version>" - the
# [all] extra alone pulls in every vendor integration the framework ships
# (Azure, Anthropic, Bedrock, Redis, Qdrant, Mem0, Mistral, Ollama, ...),
# none of which this adapter imports or needs. Every name this adapter
# touches (ContextProvider, SessionContext, Message, Agent) lives directly
# in agent-framework-core's own agent_framework package - confirmed against
# that distribution's file manifest. >=1.0 floor verified two ways: read
# the ContextProvider/SessionContext/Message source directly out of the
# agent-framework-core==1.0.0 wheel (no version-skew gap the way
# llama-index-core/google-adk had), and separately installed 1.0.0 alone
# into an isolated venv and ran a real tool-calling turn against it.
msagent = ["agent-framework-core>=1.0"]
# >=1.0 verified two ways, not just asserted: the full surface this adapter
# uses (strands.tool, Agent, DecoratedFunctionTool.tool_name, tool
# registration) was confirmed identical, by driving a real scripted
# tool-calling turn through a real Agent, at both the currently-installed
# strands-agents==1.51.0 and the literal strands-agents==1.0.0 floor
# (installed alone in an isolated venv). No version-skew gap found anywhere
# in the range, so no local ImportError guard beyond require() itself is
# needed - contrast llamaindex.py's hasattr guard, needed because its >=0.12
# floor genuinely included releases missing the attribute this adapter needs.
strands = ["strands-agents>=1.0"]
dev = ["pytest", "pytest-asyncio", "respx", "anyio", "anona[mcp]"]

[project.scripts]
anona-mcp = "anona.integrations.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anona*"]
